    <main class="supmain">
        <!-- <section id="signupForm"> -->
            <form action="quizz.html" method="post"id="signupForm">
                <fieldset class="personal-info">
                    <legend>Personal Info</legend>
                    <div class="grid-container">
                        <div class="grid-item-name">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="Enter your first name" required>
                        </div>
                        <div class="grid-item-surname">
                            <label for="surname">Surname</label>
                            <input type="text" id="surname" name="surname" placeholder="Enter your last name" required>
                        </div>
                        <div class="grid-item-homeAddress">
                            <label for="homeaddress">Home Address</label>
                            <input type="text" id="homeaddress" name="homeaddress"
                                placeholder="Enter your home address">
                            <label for="homeaddressnumber">Number</label>
                            <input type="number" id="homeaddressnumber" name="homeaddress"
                                placeholder="Enter your home address number">
                        </div>
                        <div class="grid-item-dob">
                            <label for="bday">Date of Birth</label>
                            <input type="date" id="bday" name="bday" placeholder="Enter your birthday" required>
                        </div>
                    </div>
                </fieldset>
                <fieldset class="contact-info">
                    <legend>Contact Info</legend>
                    <div class="grid-items"><label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="grid-items">
                        <label for="phonenumber">Phone Number</label>
                        <select id="country" name="country" required>
                            <option value="">Select Country</option>
                            <option value="+30">Greece (+30)</option>
                            <option value="+1">USA (+1)</option>
                            <option value="+44">UK (+44)</option>
                            <option value="+91">India (+91)</option>
                        </select>
                        <input type="tel" id="phonenumber" name="phonenumber" placeholder="Enter your phone number"
                            required>
                    </div>
                    <h3>Preferred Contact Method</h3>
                    <div class="contact-check">
                        <input type="checkbox" name="email-icon" id="email-icon">
                        <label class="contact-group" for="email-icon">
                            <img class="formimage" src="../Photos/email.png" alt="Error Loading Image">
                        </label>
                        <input type="checkbox" name="sms-icon" id="sms-icon">
                        <label class="contact-group" for="sms-icon">
                            <img class="formimage" src="../Photos/sms.png" alt="Error Loading Image">
                        </label>
                        <input type="checkbox" name="viber-icon" id="viber-icon">
                        <label class="contact-group" for="viber-icon">
                            <img class="formimage" src="../Photos/viber.png" alt="Error Loading Image">
                        </label>
                        <input type="checkbox" name="whatsapp-icon" id="whatsapp-icon">
                        <label class="contact-group" for="whatsapp-icon">
                            <img class="formimage" src="../Photos/whatsapp.png" alt="Error Loading Image">
                        </label>
                    </div>
                </fieldset>
                <fieldset class="user-info">
                    <legend>User Info</legend>
                    <div class="grid-items"><label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your Username">
                    </div>
                    <div class="grid-items"><label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your Password">
                    </div>
                    <div class="grid-items"><label for="passwordCheck">Password</label>
                        <input type="password" id="passwordCheck" name="password" placeholder="Enter your Password">
                    </div>

                </fieldset>
                <button type="submit" id="submit-btn">Submit</button>

            </form>
        <!-- </section>  -->

        <p>Already have an account?<a href="login.html">Login here</a></p>
